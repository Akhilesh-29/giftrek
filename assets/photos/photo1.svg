<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0712"/>
      <stop offset="50%" stop-color="#2a0a19"/>
      <stop offset="100%" stop-color="#0a0306"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#dfa88d" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8e142f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070305" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>
  <rect width="600" height="750" fill="url(#bg1)"/>
  <circle cx="300" cy="300" r="220" fill="url(#glow1)" filter="url(#blur1)"/>
  
  <!-- Candlelit silhouette & artistic curves -->
  <g fill="none" stroke="#e2a893" stroke-opacity="0.25" stroke-width="1.2">
    <circle cx="300" cy="375" r="240"/>
    <circle cx="300" cy="375" r="180" stroke-dasharray="4 6"/>
  </g>
  
  <!-- Intimate silhouette lines -->
  <path d="M 240,250 C 270,220 330,220 360,250 C 380,280 375,340 330,370 C 290,400 240,450 240,520 C 240,550 270,580 300,580 C 330,580 360,550 360,520" 
        fill="none" stroke="#dfa88d" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  
  <text x="300" y="460" font-family="'Cormorant Garamond', serif" font-size="28" font-style="italic" fill="#fae1cf" text-anchor="middle" letter-spacing="3" opacity="0.85">The First Glance</text>
  <text x="300" y="495" font-family="'Montserrat', sans-serif" font-size="10" fill="#dfa88d" text-anchor="middle" letter-spacing="4" text-transform="uppercase" opacity="0.6">Replace with your private photo</text>
</svg>
