<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f0714"/>
      <stop offset="50%" stop-color="#11030a"/>
      <stop offset="100%" stop-color="#2a0818"/>
    </linearGradient>
    <radialGradient id="glow3" cx="55%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#dfa88d" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#991434" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070305" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="600" height="750" fill="url(#bg3)"/>
  <circle cx="330" cy="280" r="210" fill="url(#glow3)" filter="url(#blur3)"/>

  <!-- Candle & Shadow Aesthetics -->
  <g fill="none" stroke="#e2a893" stroke-width="1.2" opacity="0.35">
    <ellipse cx="300" cy="375" rx="190" ry="260"/>
    <ellipse cx="300" cy="375" rx="140" ry="200"/>
  </g>
  
  <path d="M 270,220 C 310,240 330,290 310,340 C 290,390 320,440 340,480" 
        fill="none" stroke="#dfa88d" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
        
  <text x="300" y="450" font-family="'Cormorant Garamond', serif" font-size="28" font-style="italic" fill="#fae1cf" text-anchor="middle" letter-spacing="3" opacity="0.85">The Flame Between Us</text>
  <text x="300" y="485" font-family="'Montserrat', sans-serif" font-size="10" fill="#dfa88d" text-anchor="middle" letter-spacing="4" text-transform="uppercase" opacity="0.6">Replace with your private photo</text>
</svg>
